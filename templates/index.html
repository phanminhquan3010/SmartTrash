<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTrash — Phân loại rác thông minh</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header><div class="header-inner"><a class="brand" href="#games"><span class="brand-icon">♻</span><span>Smart<em>Trash</em></span></a><nav aria-label="Điều hướng chính"><a href="#games">Trò chơi</a><a href="#leaderboard">Bảng xếp hạng</a><a href="#guide">Cẩm nang xanh</a></nav><span class="user">♙ <span id="headerName">Người chơi</span></span></div></header>
